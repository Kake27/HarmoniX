name: Docker image build validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate Compose images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build frontend and backend images
        run: docker compose --env-file .env.example build --pull --progress plain
